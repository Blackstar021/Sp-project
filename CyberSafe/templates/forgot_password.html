<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Password help | CyberSafe</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080b12; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 390px); padding: 30px; border: 1px solid #252c39; border-radius: 22px; background: #10151f; }
    p { color: #b7c0ce; }
    a { color: #8bc6ff; }
    a:focus-visible { outline: 3px solid #75b8ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Password help</h1>
    <p>Password resets are handled by your school administrator. Contact them through an official school channel for help.</p>
    <a href="{{ url_for('login') }}">Back to log in</a>
  </main>
</body>
</html>
